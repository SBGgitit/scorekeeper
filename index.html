const ref = path => _db.ref(path);

// Game state — /rooms/ROOM_ID/state
async function loadGameState(){ try{ const s=await ref(`rooms/${ROOM_ID}/state`).once('value'); return s.exists()?s.val():null; }catch(_){return null;} }
async function saveGameState(s){ try{ await ref(`rooms/${ROOM_ID}/state`).set(s); }catch(_){} }
function subscribeGame(cb){ const r=ref(`rooms/${ROOM_ID}/state`); r.on('value',s=>{if(s.exists())cb(s.val());}); return()=>r.off('value'); }

// Global player profiles — /players/PLAYER_ID
async function loadAllProfiles(){ try{ const s=await ref('players').once('value'); return s.exists()?Object.values(s.val()):[];  }catch(_){return[];} }
async function saveProfile(p){ try{ await ref(`players/${p.id}`).set(p); }catch(_){} }
async function deleteProfile(id){ try{ await ref(`players/${id}`).remove(); }catch(_){} }
function subscribeProfiles(cb){ const r=ref('players'); r.on('value',s=>{ cb(s.exists()?Object.values(s.val()):[]);}); return()=>r.off('value'); }

// Game history — /rooms/ROOM_ID/history
async function saveGameHistory(game){ try{ await ref(`rooms/${ROOM_ID}/history`).push(game); }catch(_){} }
async function loadGameHistory(){ try{ const s=await ref(`rooms/${ROOM_ID}/history`).orderByKey().limitToLast(20).once('value'); if(!s.exists())return[]; return Object.values(s.val()).reverse(); }catch(_){return[];} }

// localStorage — remember which profiles belong to this device
function getMyProfileIds(){ try{ return JSON.parse(localStorage.getItem('myProfiles')||'[]'); }catch(_){return[];} }
function addMyProfileId(id){ const ids=getMyProfileIds(); if(!ids.includes(id)){ ids.push(id); localStorage.setItem('myProfiles',JSON.stringify(ids)); } }
function removeMyProfileId(id){ const ids=getMyProfileIds().filter(x=>x!==id); localStorage.setItem('myProfiles',JSON.stringify(ids)); }

// ── Color helpers ─────────────────────────────────────────────────────────────
function h2r(hex){return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];}
function r2h(r,g,b){return"#"+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,"0")).join("");}
function lum(hex){const[r,g,b]=h2r(hex);return(.299*r+.587*g+.114*b)/255;}
function fg(hex){return lum(hex)>.48?"#111":"#fff";}
function dk(hex,f=.55){const[r,g,b]=h2r(hex);return r2h(r*f,g*f,b*f);}
function mute(hex){const[r,g,b]=h2r(hex);return r2h(r*.28+10,g*.28+10,b*.28+10);}
function h2v(hex){let[r,g,b]=h2r(hex);r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0,s=mx?d/mx:0,v=mx;if(d){if(mx===r)h=((g-b)/d+6)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}return[h,s,v];}
function v2h(h,s,v){const i=Math.floor(h/60)%6,f=h/60-Math.floor(h/60),p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);const[r,g,b]=[[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i];return r2h(r*255,g*255,b*255);}

// ── Default profile factory ───────────────────────────────────────────────────
function mkProfile(idx=0){
  const b=BALLS[idx%BALLS.length];
  return{id:genId(),name:`Joueur ${idx+1}`,bc:b.c,fc:FELTS[idx%FELTS.length],stripe:b.s,bn:b.num,photo:null,sndPing:true,sndNum:true,sndName:true,sndTotal:true,gamesPlayed:0,totalScore:0};
}
function mkGameState(players,goal){
  return{players:players.map(p=>({...p,score:0})),history:[],v:0,goal,startedAt:Date.now()};
}

// ── Audio ─────────────────────────────────────────────────────────────────────
let _actx=null;
function getCtx(){if(!_actx)try{_actx=new(window.AudioContext||window.webkitAudioContext)();}catch(_){}if(_actx?.state==='suspended')_actx.resume();return _actx;}
function playPositivePing(){const ctx=getCtx();if(!ctx)return;const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(660,t);o.frequency.exponentialRampToValueAtTime(1320,t+.06);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.45,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.55);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.55);}
function playNegativeBuzz(){const ctx=getCtx();if(!ctx)return;[0,.20].forEach(off=>{const t=ctx.currentTime+off,o=ctx.createOscillator(),g=ctx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(100,t+.12);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.40,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.13);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.14);});}
let _voices=[];
function loadVoices(){_voices=window.speechSynthesis?.getVoices()||[];}
window.speechSynthesis?.addEventListener('voiceschanged',loadVoices);setTimeout(loadVoices,300);
function frenchVoice(){const fr=_voices.filter(v=>v.lang.startsWith('fr'));return fr.find(v=>/thomas|nicolas|pierre|male/i.test(v.name))||fr.find(v=>!/amelie|aurelie|female|femme/i.test(v.name))||fr[0]||null;}
function speak(text,onEnd){if(!window.speechSynthesis){onEnd?.();return;}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=1.05;u.pitch=1.0;const v=frenchVoice();if(v)u.voice=v;u.onend=()=>onEnd?.();u.onerror=()=>onEnd?.();window.speechSynthesis.speak(u);}
function numFr(n){const w=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf','vingt'];return(n>=0&&n<w.length)?w[n]:String(n);}
function deltaFr(d){const a=Math.abs(d),w=a<=20?numFr(a):String(a);if(d===1)return'un point';if(d>0)return`${w} points`;return`moins ${w}`;}
function totalFr(s){const a=Math.abs(s),w=a<=20?numFr(a):String(a);return s<0?`moins ${w}`:w;}
function playTapAudio(player,delta,newScore){
  const pos=delta>0,steps=[];
  if(player.sndPing!==false)steps.push('ping');
  if(player.sndNum!==false)steps.push('num');
  if(player.sndName!==false)steps.push('name');
  if(player.sndTotal!==false)steps.push('total');
  if(!steps.length)return;
  let i=0;
  function next(){if(i>=steps.length)return;const s=steps[i++];if(s==='ping'){if(pos){playPositivePing();setTimeout(next,560);}else{playNegativeBuzz();setTimeout(next,420);}}else if(s==='num')speak(deltaFr(delta),next);else if(s==='name')speak(player.name,next);else if(s==='total')speak(totalFr(newScore),next);}
  next();
}
const SFX=["https://www.soundjay.com/misc/sounds/fanfare-1.mp3","https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3","https://www.soundjay.com/human/sounds/applause-8.mp3"];
function playWin(){try{const a=new Audio(SFX[Math.floor(Math.random()*SFX.length)]);a.volume=.7;a.play().catch(()=>{});}catch(_){}}

// ── Ball SVG ──────────────────────────────────────────────────────────────────
function Ball({c,stripe,num,photo,size=56,rolling=false}){
  const r=size/2,uid=`b${(c||"0").replace(/\W/g,"")}-${num}-${size}-${rolling?1:0}`;
  const mr=r*.36,fs=num>=10?(size<32?size*.24:size*.27):(size<32?size*.30:size*.33);
  const bY1=r*.28,bY2=r*1.72,ry=r*.19,sz=size;
  const sp=[`M 0 ${bY1}`,`A ${r} ${ry} 0 0 1 ${sz} ${bY1}`,`L ${sz} ${bY2}`,`A ${r} ${ry} 0 0 0 0 ${bY2}`,`Z`].join(" ");
  const wobId=`wob-${uid}`,TILT=40;
  if(photo) return(
    <div style={{width:size,height:size,borderRadius:"50%",overflow:"hidden",flexShrink:0,outline:`${Math.max(2,size*.05)}px solid ${c}`,outlineOffset:`${-Math.max(2,size*.05)}px`,background:"#111"}}>
      <img src={photo} alt="" style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>
    </div>
  );
  return(
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:"block",flexShrink:0}}>
      {rolling&&<style>{`@keyframes ${wobId}{0%,100%{transform:translateY(0)}25%{transform:translateY(-${size*.04}px) translateX(${size*.04}px)}75%{transform:translateY(${size*.02}px) translateX(-${size*.02}px)}}`}</style>}
      <defs>
        <clipPath id={`${uid}-cl`}><circle cx={r} cy={r} r={r-.5}/></clipPath>
        <radialGradient id={`${uid}-sp`} cx="34%" cy="28%" r="42%" gradientUnits="objectBoundingBox"><stop offset="0%" stopColor="rgba(255,255,255,.70)"/><stop offset="30%" stopColor="rgba(255,255,255,.14)"/><stop offset="100%" stopColor="rgba(0,0,0,0)"/></radialGradient>
        <radialGradient id={`${uid}-ao`} cx="50%" cy="50%" r="50%" gradientUnits="objectBoundingBox"><stop offset="76%" stopColor="rgba(0,0,0,0)"/><stop offset="100%" stopColor="rgba(0,0,0,.42)"/></radialGradient>
        <radialGradient id={`${uid}-sh`} cx="50%" cy="90%" r="55%" gradientUnits="objectBoundingBox"><stop offset="0%" stopColor="rgba(0,0,0,.28)"/><stop offset="100%" stopColor="rgba(0,0,0,0)"/></radialGradient>
      </defs>
      <g style={rolling?{animation:`${wobId} 2.2s ease-in-out infinite`}:{}}>
        <g clipPath={`url(#${uid}-cl)`}>
          <rect x={0} y={0} width={size} height={size} fill={stripe?"#F5F0E8":c}/>
          {rolling?(
            <g transform={`rotate(${TILT} ${r} ${r})`}><g>
              <animateTransform attributeName="transform" type="rotate" from={`0 ${r} ${r}`} to={`360 ${r} ${r}`} dur="3s" repeatCount="indefinite" calcMode="linear"/>
              <g transform={`rotate(${-TILT} ${r} ${r})`}>
                {stripe&&<path d={sp} fill={c}/>}
                <circle cx={r} cy={r} r={mr} fill="#F8F5EE"/>
                <text x={r} y={r} textAnchor="middle" dominantBaseline="central" fontSize={fs} fontWeight="700" fill="#1a0808" fontFamily="Georgia,serif" letterSpacing={num>=10?"-0.5":"0"}>{num}</text>
              </g>
            </g></g>
          ):(
            <>{stripe&&<path d={sp} fill={c}/>}<circle cx={r} cy={r} r={mr} fill="#F8F5EE"/><text x={r} y={r} textAnchor="middle" dominantBaseline="central" fontSize={fs} fontWeight="700" fill="#1a0808" fontFamily="Georgia,serif" letterSpacing={num>=10?"-0.5":"0"}>{num}</text></>
          )}
          <rect x={0} y={0} width={size} height={size} fill={`url(#${uid}-sh)`}/>
          <rect x={0} y={0} width={size} height={size} fill={`url(#${uid}-ao)`}/>
          <rect x={0} y={0} width={size} height={size} fill={`url(#${uid}-sp)`}/>
        </g>
        <circle cx={r} cy={r} r={r-.5} fill="none" stroke="rgba(0,0,0,.22)" strokeWidth="1.5"/>
      </g>
    </svg>
  );
}

// ── Rail ──────────────────────────────────────────────────────────────────────
function Rail({fc,top}){
  const rc=dk(fc,.46),dc=dk(fc,.58),H=12,br=top?"12px 12px 0 0":"0 0 12px 12px";
  return(
    <div style={{flexShrink:0,height:H,background:rc,borderRadius:br,position:"relative",zIndex:2}}>
      {[.2,.38,.5,.62,.8].map(x=><div key={x} style={{width:3,height:3,borderRadius:"50%",background:dc,position:"absolute",top:"50%",left:`${x*100}%`,transform:"translate(-50%,-50%)"}}/>)}
      {[0,1].map(s=><div key={s} style={{position:"absolute",[s?"right":"left"]:0,[top?"top":"bottom"]:0,width:H*1.3,height:H*1.3,background:"#0a0a0a",zIndex:3,borderRadius:top?(s?"0 0 0 100%":"0 0 100% 0"):(s?"100% 0 0 0":"0 100% 0 0")}}/>)}
      <div style={{position:"absolute",left:"50%",transform:"translateX(-50%)",[top?"top":"bottom"]:0,width:H,height:H*.7,borderRadius:top?"0 0 100% 100%":"100% 100% 0 0",background:"#0a0a0a",zIndex:3}}/>
    </div>

// ── Color Wheel ───────────────────────────────────────────────────────────────
function Wheel({color,onChange}){
  const cr=useRef(null),sr=useRef(null);
  const[hsv,setHsv]=useState(()=>h2v(color||"#1B5E20"));
  const dw=useRef(false),ds=useRef(false);
  const SZ=192,CX=96,CY=96,OR=94,IR=66,SQ=IR*1.36;
  useEffect(()=>{const c=cr.current;if(!c)return;const ctx=c.getContext("2d");ctx.clearRect(0,0,SZ,SZ);for(let d=0;d<360;d++){const a0=(d-1)*Math.PI/180,a1=(d+1)*Math.PI/180;ctx.beginPath();ctx.moveTo(CX,CY);ctx.arc(CX,CY,OR,a0,a1);ctx.closePath();ctx.fillStyle=v2h(d,1,1);ctx.fill();}ctx.globalCompositeOperation="destination-out";ctx.beginPath();ctx.arc(CX,CY,IR,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation="source-over";},[]);
  useEffect(()=>{const c=sr.current;if(!c)return;const ctx=c.getContext("2d"),N=SQ;const gH=ctx.createLinearGradient(0,0,N,0);gH.addColorStop(0,"#fff");gH.addColorStop(1,v2h(hsv[0],1,1));ctx.fillStyle=gH;ctx.fillRect(0,0,N,N);const gV=ctx.createLinearGradient(0,0,0,N);gV.addColorStop(0,"rgba(0,0,0,0)");gV.addColorStop(1,"rgba(0,0,0,1)");ctx.fillStyle=gV;ctx.fillRect(0,0,N,N);},[hsv[0]]);
  const set=(h)=>{setHsv(h);onChange(v2h(...h));};
  const hue=(e)=>{const rect=cr.current.getBoundingClientRect(),cx=(e.clientX??e.touches?.[0]?.clientX)-rect.left-CX,cy=(e.clientY??e.touches?.[0]?.clientY)-rect.top-CY;let a=Math.atan2(cy,cx)*180/Math.PI;return a<0?a+360:a;};
  const sv=(e)=>{const rect=sr.current.getBoundingClientRect(),x=Math.max(0,Math.min(SQ,(e.clientX??e.touches?.[0]?.clientX)-rect.left)),y=Math.max(0,Math.min(SQ,(e.clientY??e.touches?.[0]?.clientY)-rect.top));return[x/SQ,1-y/SQ];};
  useEffect(()=>{const up=()=>{dw.current=false;ds.current=false;};window.addEventListener("mouseup",up);window.addEventListener("touchend",up);return()=>{window.removeEventListener("mouseup",up);window.removeEventListener("touchend",up);};},[]);
  const hrad=hsv[0]*Math.PI/180,hm=(OR+IR)/2,hx=CX+hm*Math.cos(hrad),hy=CY+hm*Math.sin(hrad);
  const sx2=hsv[1]*SQ,sy2=(1-hsv[2])*SQ;
  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:10,userSelect:"none"}}>
      <div style={{position:"relative",width:SZ,height:SZ,touchAction:"none"}}
        onMouseDown={e=>{e.preventDefault();dw.current=true;set([hue(e),hsv[1],hsv[2]]);}} onMouseMove={e=>{if(!dw.current)return;e.preventDefault();set([hue(e),hsv[1],hsv[2]]);}}
        onTouchStart={e=>{e.preventDefault();dw.current=true;set([hue(e),hsv[1],hsv[2]]);}} onTouchMove={e=>{if(!dw.current)return;e.preventDefault();set([hue(e),hsv[1],hsv[2]]);}}>
        <canvas ref={cr} width={SZ} height={SZ} style={{position:"absolute",top:0,left:0}}/>
        <div style={{position:"absolute",left:hx-8,top:hy-8,width:16,height:16,borderRadius:"50%",border:"2.5px solid #fff",background:v2h(hsv[0],1,1),pointerEvents:"none"}}/>
        <div style={{position:"absolute",left:CX-SQ/2,top:CY-SQ/2,width:SQ,height:SQ,borderRadius:5,overflow:"hidden",touchAction:"none"}}
          onMouseDown={e=>{e.stopPropagation();e.preventDefault();ds.current=true;const[s,v]=sv(e);set([hsv[0],s,v]);}} onMouseMove={e=>{if(!ds.current)return;e.stopPropagation();e.preventDefault();const[s,v]=sv(e);set([hsv[0],s,v]);}}
          onTouchStart={e=>{e.stopPropagation();e.preventDefault();ds.current=true;const[s,v]=sv(e);set([hsv[0],s,v]);}} onTouchMove={e=>{if(!ds.current)return;e.stopPropagation();e.preventDefault();const[s,v]=sv(e);set([hsv[0],s,v]);}}>
          <canvas ref={sr} width={SQ} height={SQ} style={{display:"block"}}/>
          <div style={{position:"absolute",left:sx2-6,top:sy2-6,width:12,height:12,borderRadius:"50%",border:"2px solid #fff",background:v2h(...hsv),pointerEvents:"none"}}/>
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <div style={{width:28,height:28,borderRadius:7,background:v2h(...hsv),border:"2px solid #ffffff22"}}/>
        <input value={v2h(...hsv)} onChange={e=>{if(/^#[0-9a-fA-F]{6}$/.test(e.target.value))set(h2v(e.target.value));}} style={{background:"#1a1a1a",border:"1px solid #333",borderRadius:7,color:"#ccc",fontSize:13,padding:"5px 8px",fontFamily:"monospace",width:78,outline:"none"}}/>
      </div>
    </div>
  );
}
function WheelModal({title,color,onDone,onCancel}){
  const[cur,setCur]=useState(color);
  return(
    <div style={{position:"fixed",inset:0,background:"#000c",zIndex:600,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:F}}>
      <div style={{background:"#161616",borderRadius:20,padding:20,display:"flex",flexDirection:"column",alignItems:"center",gap:14,maxWidth:260,width:"90%"}}>
        <div style={{color:"#FFD700",fontSize:13,fontWeight:700,letterSpacing:2}}>{title}</div>

// ── Photo Crop ────────────────────────────────────────────────────────────────
function CropModal({onDone,onCancel}){
  const SZ=230;
  const[src,setSrc]=useState(null);
  const xr=useRef({x:0,y:0,scale:1}),[xf,setXf]=useState({x:0,y:0,scale:1});
  const cvr=useRef(null),imgr=useRef(null),contr=useRef(null);
  const drg=useRef(false),lm=useRef(null),lpd=useRef(null),lpm=useRef(null);
  const ax=(n)=>{n.scale=Math.max(1,Math.min(8,n.scale));xr.current=n;setXf({...n});};
  const onLoad=()=>ax({x:0,y:0,scale:1});
  const onFile=(e)=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=ev=>{setSrc(ev.target.result);ax({x:0,y:0,scale:1});};rd.readAsDataURL(f);};
  const mdown=(e)=>{e.preventDefault();drg.current=true;lm.current={x:e.clientX,y:e.clientY};};
  const mmove=(e)=>{if(!drg.current)return;e.preventDefault();const dx=e.clientX-lm.current.x,dy=e.clientY-lm.current.y;lm.current={x:e.clientX,y:e.clientY};ax({...xr.current,x:xr.current.x+dx,y:xr.current.y+dy});};
  const mup=()=>{drg.current=false;};
  const whl=(e)=>{e.preventDefault();ax({...xr.current,scale:xr.current.scale*(e.deltaY<0?1.1:.92)});};
  const md2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),mp2=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
  const ta=(e)=>Array.from(e.touches).map(t=>({x:t.clientX,y:t.clientY}));
  const tdown=(e)=>{e.preventDefault();const ts=ta(e);if(ts.length===1){drg.current=true;lm.current=ts[0];lpd.current=null;}else if(ts.length===2){drg.current=false;lpd.current=md2(ts[0],ts[1]);lpm.current=mp2(ts[0],ts[1]);}};
  const tmove=(e)=>{e.preventDefault();const ts=ta(e);if(ts.length===1&&drg.current){const dx=ts[0].x-lm.current.x,dy=ts[0].y-lm.current.y;lm.current=ts[0];ax({...xr.current,x:xr.current.x+dx,y:xr.current.y+dy});}else if(ts.length===2){const d=md2(ts[0],ts[1]),m=mp2(ts[0],ts[1]);if(lpd.current){const f=d/lpd.current;ax({x:xr.current.x+(m.x-lpm.current.x),y:xr.current.y+(m.y-lpm.current.y),scale:xr.current.scale*f});}lpd.current=d;lpm.current=m;}};
  const tend=(e)=>{if(!e.touches.length){drg.current=false;lpd.current=null;}else if(e.touches.length===1){lpd.current=null;drg.current=true;lm.current={x:e.touches[0].clientX,y:e.touches[0].clientY};}};
  useEffect(()=>{window.addEventListener("mouseup",mup);return()=>window.removeEventListener("mouseup",mup);},[]);
  const crop=()=>{const cv=cvr.current,ctx=cv.getContext("2d"),img=imgr.current;cv.width=SZ;cv.height=SZ;ctx.clearRect(0,0,SZ,SZ);const{x,y,scale}=xr.current;ctx.save();ctx.translate(SZ/2+x,SZ/2+y);ctx.scale(scale,scale);ctx.drawImage(img,-SZ/2,-SZ/2,SZ,SZ);ctx.restore();onDone(cv.toDataURL("image/jpeg",.88));};
  return(
    <div style={{position:"fixed",inset:0,background:"#000d",zIndex:700,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14,fontFamily:F}}>
      <div style={{color:"#FFD700",fontSize:15,fontWeight:700,letterSpacing:2}}>RECADRER</div>
      {!src
        ?<label style={{background:"#1a1a1a",border:"2px dashed #333",borderRadius:16,padding:"30px 40px",color:"#666",cursor:"pointer",fontSize:14,textAlign:"center",lineHeight:1.8}}>📷<br/>Choisir une photo<input type="file" accept="image/*" onChange={onFile} style={{display:"none"}}/></label>
        :<>
          <div ref={contr} onMouseDown={mdown} onMouseMove={mmove} onTouchStart={tdown} onTouchMove={tmove} onTouchEnd={tend} onWheel={whl}
            style={{position:"relative",width:SZ,height:SZ,borderRadius:"50%",overflow:"hidden",background:"#222",cursor:"grab",touchAction:"none",outline:"3px solid #FFD700",flexShrink:0}}>
            <img ref={imgr} src={src} alt="" onLoad={onLoad} draggable={false} style={{position:"absolute",width:"100%",height:"100%",objectFit:"cover",left:0,top:0,transform:`translate(${xf.x}px,${xf.y}px) scale(${xf.scale})`,transformOrigin:"center center",pointerEvents:"none"}}/>
          </div>
          <div style={{color:"#555",fontSize:11}}>Glisser · Pincer pour zoomer</div>
        </>
      }
      <div style={{display:"flex",gap:10}}>
        <button onClick={onCancel} style={{background:"#222",color:"#777",border:"none",borderRadius:10,padding:"10px 22px",fontSize:14,cursor:"pointer",fontFamily:F}}>Annuler</button>
        {src&&<button onClick={crop} style={{background:"#FFD700",color:"#111",border:"none",borderRadius:10,padding:"10px 22px",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:F}}>Utiliser</button>}
      </div>
      <canvas ref={cvr} style={{display:"none"}}/>
    </div>
  );
}

    <div style={{position:"relative",flexShrink:0}}>
      {player.photo&&<div style={{position:"absolute",inset:-3,borderRadius:"50%",border:`3px solid ${player.bc}`,zIndex:1,pointerEvents:"none"}}/>}
      <Ball c={player.bc} stripe={player.stripe} num={player.bn||1} photo={player.photo} size={ballSize} rolling={true}/>
    </div>
  );
  return(
    <div style={{display:"flex",flexDirection:"column",borderRadius:12,overflow:"hidden",userSelect:"none",minHeight:0,WebkitTapHighlightColor:"transparent"}}
      onPointerDown={panelDown} onPointerMove={panelMove} onPointerUp={panelUp} onPointerCancel={panelCancel}>
      <Rail fc={felt} top={true}/>
      <div style={{flex:1,minHeight:0,position:"relative",background:felt,overflow:"hidden"}}>
        {flash&&<div style={{position:"absolute",inset:0,zIndex:6,pointerEvents:"none",background:flash==="pos"?"rgba(255,255,255,.18)":"rgba(0,0,0,.26)",animation:"flashOut .26s ease-out forwards"}}/>}
        <div style={{position:"absolute",top:7,left:7,zIndex:5,display:"flex",alignItems:"center",gap:7,maxWidth:"65%",pointerEvents:"none"}}>
          {avatarEl}
          <div style={{color:tfg,fontWeight:700,fontFamily:F,fontSize:"clamp(15px,3.2vw,26px)",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{player.name}</div>
        </div>
        {teamMate&&(
          <div style={{position:"absolute",top:7,right:7,zIndex:5,display:"flex",alignItems:"center",gap:6,maxWidth:"44%",pointerEvents:"none"}}>
            <div style={{color:tfg,opacity:.82,fontWeight:600,fontFamily:F,fontSize:"clamp(11px,2.2vw,18px)",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{teamMate.name}</div>
            <div style={{position:"relative",flexShrink:0}}>
              {teamMate.photo&&<div style={{position:"absolute",inset:-2,borderRadius:"50%",border:`2px solid ${teamMate.bc}`,zIndex:1}}/>}
              <Ball c={teamMate.bc} stripe={teamMate.stripe} num={teamMate.bn||2} photo={teamMate.photo} size={Math.round(ballSize*.6)} rolling={true}/>
            </div>
          </div>
        )}
        <div style={{...zoneStyle,left:0}} onClick={e=>{e.stopPropagation();if(didLong.current)return;flash_("neg");onMinus();}}>
          <span style={{...hintStyle,color:tfg}}>−</span>
        </div>
        <div style={{...zoneStyle,right:0}} onClick={e=>{e.stopPropagation();if(didLong.current)return;flash_("pos");onPlus();}}>
          <span style={{...hintStyle,color:tfg}}>+</span>
        </div>
        <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",gap:teamMate?"clamp(12px,4vw,40px)":"0",zIndex:3,pointerEvents:"none"}}>
          <div style={{position:"relative",display:"inline-flex",alignItems:"flex-start"}}>
            <div style={{color:tfg,fontFamily:F,fontWeight:900,fontSize:scoreSize,lineHeight:1,letterSpacing:-3,pointerEvents:"auto",cursor:"pointer",padding:"4px 12px",borderRadius:8,WebkitTapHighlightColor:"transparent"}}
              onClick={e=>{e.stopPropagation();if(didLong.current)return;onScoreTap(player);}}
              onPointerEnter={e=>e.currentTarget.style.background="rgba(255,255,255,.12)"}
              onPointerLeave={e=>e.currentTarget.style.background="transparent"}
            >{player.score}</div>
            {isLeader&&<span style={{fontSize:"clamp(14px,2.5dvh,26px)",lineHeight:1,marginTop:"4px",marginLeft:"-6px",filter:"drop-shadow(0 1px 3px rgba(0,0,0,.5))"}}>⭐</span>}
          </div>
          {teamMate&&(
            <div style={{color:fg(teamMate.fc||felt),fontFamily:F,fontWeight:900,fontSize:"clamp(46px,11dvh,130px)",lineHeight:1,letterSpacing:-2,opacity:.88,pointerEvents:"auto",cursor:"pointer",padding:"4px 12px",borderRadius:8,WebkitTapHighlightColor:"transparent"}}
              onClick={e=>{e.stopPropagation();if(didLong.current)return;onScoreTap(teamMate);}}
              onPointerEnter={e=>e.currentTarget.style.background="rgba(255,255,255,.12)"}
              onPointerLeave={e=>e.currentTarget.style.background="transparent"}
            >{teamMate.score}</div>
          )}
        </div>
      </div>
      <Rail fc={felt} top={false}/>
    </div>
  );
}

// ── Selection Screen ──────────────────────────────────────────────────────────
// Shows all Firebase profiles. Check to select for current game.
// My profiles (created on this device) are highlighted.
function SelectionScreen({onStart}){
  const[profiles,setProfiles]=useState([]);
  const[selected,setSelected]=useState(new Set()); // profile IDs checked for this game
  const[goal,setGoal]=useState(0);
  const[sndPing,setSndPing]=useState(true),[sndNum,setSndNum]=useState(true);
  const[sndName,setSndName]=useState(true),[sndTotal,setSndTotal]=useState(true);
  const[editingProfile,setEditingProfile]=useState(null); // profile being edited
  const[creatingNew,setCreatingNew]=useState(false);
  const[showGameHist,setShowGameHist]=useState(false);
  const[loading,setLoading]=useState(true);
  const myIds=getMyProfileIds();

  useEffect(()=>{
    const unsub=subscribeProfiles(profs=>{
      setProfiles(profs.sort((a,b)=>a.name.localeCompare(b.name)));
      setLoading(false);
    });
    return unsub;
  },[]);

  // Auto-select my profiles on first load
  useEffect(()=>{
    if(profiles.length>0&&selected.size===0){
      const mine=profiles.filter(p=>myIds.includes(p.id));
      if(mine.length>0) setSelected(new Set(mine.map(p=>p.id)));
    }
  },[profiles]);

  function toggleSelect(id){
    setSelected(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});
  }

  async function handleSaveProfile(p){
    const stamped={...p,sndPing,sndNum,sndName,sndTotal};
    await saveProfile(stamped);
    if(creatingNew){ addMyProfileId(p.id); setCreatingNew(false); setSelected(prev=>new Set([...prev,p.id])); }
    else setEditingProfile(null);
  }

  async function handleDeleteProfile(id){
    if(!confirm("Supprimer ce profil ?"))return;
    await deleteProfile(id);
    removeMyProfileId(id);
    setSelected(prev=>{const n=new Set(prev);n.delete(id);return n;});
    setEditingProfile(null);
  }

  function handleStart(){
    const chosen=profiles.filter(p=>selected.has(p.id));
    if(chosen.length<MIN_P){alert(`Sélectionner au moins ${MIN_P} joueurs.`);return;}
    if(chosen.length>MAX_P){alert(`Maximum ${MAX_P} joueurs.`);return;}
    const stamped=chosen.map(p=>({...p,sndPing,sndNum,sndName,sndTotal}));
    onStart(stamped,goal);
  }

  const selectedCount=selected.size;
  const canStart=selectedCount>=MIN_P&&selectedCount<=MAX_P;

  return(
    <div style={{height:"100dvh",background:"#0d0d0d",display:"flex",flexDirection:"column",fontFamily:F,overflow:"hidden"}}>
      {editingProfile&&(
        <ProfileEditor profile={editingProfile} allProfiles={profiles}
          onSave={handleSaveProfile} onCancel={()=>setEditingProfile(null)}
          onDelete={()=>handleDeleteProfile(editingProfile.id)}/>
      )}
      {creatingNew&&(
        <ProfileEditor profile={mkProfile(profiles.length)} allProfiles={profiles} isNew={true}
          onSave={handleSaveProfile} onCancel={()=>setCreatingNew(false)}/>
      )}
      {showGameHist&&<GameHistoryPanel onClose={()=>setShowGameHist(false)}/>}

      {/* ── Header ── */}
      <div style={{flexShrink:0,background:"#0d0d0d",borderBottom:"1px solid #1a1a1a",padding:"max(16px,env(safe-area-inset-top)) 16px 12px"}}>
        {/* Title row */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <div style={{color:"#FFD700",fontSize:20,fontWeight:900,letterSpacing:3}}>🎱 SCOREKEEPER</div>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>setShowGameHist(true)} style={{background:"#1a1a1a",border:"none",color:"#666",borderRadius:9,padding:"7px 12px",fontSize:13,cursor:"pointer",fontFamily:F}}>📋 Parties</button>
            <button onClick={()=>setCreatingNew(true)} style={{background:"#1e1e1e",border:"none",color:"#6ddb6d",borderRadius:9,padding:"7px 12px",fontSize:13,cursor:"pointer",fontFamily:F}}>+ Joueur</button>
          </div>
        </div>

        {/* Objectif + Audio row */}
        <div style={{display:"flex",alignItems:"stretch",gap:8}}>
          <div style={{flex:1,display:"flex",alignItems:"center",gap:10,background:"#1a1a1a",borderRadius:11,padding:"9px 14px"}}>
            <div style={{color:"#FFD700",fontSize:13,fontWeight:700}}>🏆</div>
            <input type="number" min={0} value={goal||""} onChange={e=>setGoal(Math.max(0,parseInt(e.target.value)||0))}
              style={{flex:1,background:"transparent",border:"none",borderBottom:"2px solid #333",color:"#fff",fontSize:18,fontWeight:700,fontFamily:F,outline:"none",padding:"2px 0",textAlign:"right"}}/>
          </div>
          <div style={{background:"#1a1a1a",borderRadius:11,padding:"8px 12px",display:"flex",flexDirection:"column",gap:5}}>
            <Toggle on={sndPing}  onChange={setSndPing}  label="SON"/>
            <Toggle on={sndNum}   onChange={setSndNum}   label="POINT"/>
            <Toggle on={sndName}  onChange={setSndName}  label="NOM"/>
            <Toggle on={sndTotal} onChange={setSndTotal} label="TOTAL"/>
          </div>
        </div>

        {/* Selected count + start button */}
        <div style={{display:"flex",alignItems:"center",gap:8,marginTop:10}}>
          <div style={{color:"#555",fontSize:12,flex:1}}>{selectedCount<MIN_P?`Sélectionner au moins ${MIN_P} joueurs`:selectedCount>MAX_P?`Maximum ${MAX_P} joueurs`:`${selectedCount} joueur${selectedCount>1?"s":""} sélectionné${selectedCount>1?"s":""}`}</div>
          <button onClick={handleStart} disabled={!canStart}
            style={{background:canStart?"#FFD700":"#2a2a2a",color:canStart?"#111":"#555",border:"none",borderRadius:11,padding:"10px 24px",fontSize:15,fontWeight:800,cursor:canStart?"pointer":"default",fontFamily:F,transition:"background .2s"}}>
            ▶ Commencer
          </button>
        </div>
      </div>

      {/* ── Profile list ── */}
      <div className="scroll" style={{flex:1,padding:"8px 12px 24px"}}>
        {loading&&<div style={{color:"#444",textAlign:"center",marginTop:40,fontSize:14}}>Chargement des profils...</div>}
        {!loading&&profiles.length===0&&(
          <div style={{color:"#444",textAlign:"center",marginTop:40,fontSize:14,lineHeight:2}}>
            Aucun profil.<br/>
            <button onClick={()=>setCreatingNew(true)} style={{background:"#1e1e1e",border:"none",color:"#6ddb6d",borderRadius:9,padding:"8px 16px",fontSize:13,cursor:"pointer",fontFamily:F,marginTop:8}}>+ Créer le premier joueur</button>
          </div>
        )}
        {profiles.map(p=>{
          const isMine=myIds.includes(p.id);
          const isSelected=selected.has(p.id);
          return(
            <div key={p.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",marginBottom:6,borderRadius:12,
              background:isSelected?p.fc+"33":"#1a1a1a",
              border:`2px solid ${isSelected?p.fc:"transparent"}`,
              transition:"background .15s,border .15s"}}>
              {/* Checkbox */}
              <div onClick={()=>toggleSelect(p.id)} style={{width:24,height:24,borderRadius:6,border:`2px solid ${isSelected?p.fc:"#444"}`,background:isSelected?p.fc:"transparent",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",transition:"all .15s"}}>
                {isSelected&&<span style={{color:fg(p.fc),fontSize:14,fontWeight:900,lineHeight:1}}>✓</span>}
              </div>

              {/* Ball */}
              <div onClick={()=>toggleSelect(p.id)} style={{cursor:"pointer",flexShrink:0}}>
                <Ball c={p.bc} stripe={p.stripe} num={p.bn||1} photo={p.photo} size={44}/>
              </div>

              {/* Name + stats */}
              <div onClick={()=>toggleSelect(p.id)} style={{flex:1,cursor:"pointer"}}>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <div style={{color:"#fff",fontWeight:700,fontSize:16,fontFamily:F}}>{p.name}</div>
                  {isMine&&<div style={{color:"#FFD700",fontSize:10,background:"rgba(255,215,0,.15)",borderRadius:4,padding:"1px 5px"}}>moi</div>}
                </div>
                {p.gamesPlayed>0&&<div style={{color:"#555",fontSize:11}}>{p.gamesPlayed} partie{p.gamesPlayed>1?"s":""} · moy {p.gamesPlayed>0?Math.round((p.totalScore||0)/p.gamesPlayed):0} pts</div>}
              </div>

              {/* Edit button */}
              <button onClick={e=>{e.stopPropagation();setEditingProfile({...p});}}
                style={{background:"rgba(255,255,255,.06)",border:"none",color:"#666",borderRadius:8,padding:"6px 10px",fontSize:12,cursor:"pointer",fontFamily:F}}>✏️</button>
            </div>
          );
        })}
        <div style={{color:"#2a2a2a",fontSize:10,textAlign:"center",marginTop:16,fontFamily:F}}>v{VERSION}</div>
      </div>
    </div>
  );
}

// ── Game Screen ───────────────────────────────────────────────────────────────
function Game({initialState,onExit}){
  const[gs,setGs]=useState(initialState);
  const[showHist,setShowHist]=useState(false);
  const[correctP,setCorrectP]=useState(null);
  const[editP,setEditP]=useState(null);
  const[toast,setToast]=useState(null);
  const[victor,setVictor]=useState(null);
  const vRef=useRef(initialState.v||0);
  const won=useRef(new Set());

  useEffect(()=>{
    const unsub=subscribeGame(remote=>{
      if(remote&&(remote.v||0)>vRef.current){vRef.current=remote.v||0;setGs(remote);}
    });
    return unsub;
  },[]);

  async function push(next){
    next.v=(vRef.current||0)+1;vRef.current=next.v;
    if(next.goal>0&&!victor){
      for(const p of next.players){
        if(p.score>=next.goal&&!won.current.has(p.id)){won.current.add(p.id);setVictor({...p});break;}
      }
    }
    setGs(next);await saveGameState(next);
  }
  function toast_(msg,c="#FFD700"){setToast({msg,c});setTimeout(()=>setToast(null),700);}

  async function addPoint(player,delta){
    const next=JSON.parse(JSON.stringify(gs));
    const pi=next.players.findIndex(p=>p.id===player.id);if(pi<0)return;
    next.players[pi].score+=delta;
    const newScore=next.players[pi].score;
    next.history.push({pid:player.id,delta,sa:newScore,corr:[],sac:[]});
    playTapAudio(next.players[pi],delta,newScore);
    await push(next);
  }

  async function handleUndo(){
    const next=JSON.parse(JSON.stringify(gs));
    if(next.history.length){
      const last=next.history.pop(),tc=(last.corr||[]).reduce((a,b)=>a+b,0);
      const pi=next.players.findIndex(p=>p.id===last.pid);
      if(pi>=0)next.players[pi].score-=(last.delta+tc);
      toast_("Annulé","#9B59B6");
    }
    await push(next);
  }

  async function handleEndGame(){
    if(!confirm("Terminer la partie et retourner à la sélection ?"))return;
    // Save game to history
    await saveGameHistory({
      startedAt:gs.startedAt||Date.now(),
      endedAt:Date.now(),
      goal:gs.goal||0,
      players:gs.players.map(p=>({id:p.id,name:p.name,bc:p.bc,fc:p.fc,stripe:p.stripe,bn:p.bn,photo:p.photo,score:p.score}))
    });
    // Update player stats in Firebase
    for(const p of gs.players){
      try{
        const snap=await ref(`players/${p.id}`).once('value');
        if(snap.exists()){
          const prof=snap.val();
          await ref(`players/${p.id}`).update({
            gamesPlayed:(prof.gamesPlayed||0)+1,
            totalScore:(prof.totalScore||0)+p.score,
          });
        }
      }catch(_){}
    }
    // Clear game state
    await saveGameState({v:0,done:false});
    onExit();
  }

  async function applyCorrection(player,delta){
    const next=JSON.parse(JSON.stringify(gs));
    const pi=next.players.findIndex(p=>p.id===player.id);if(pi<0)return;
    next.players[pi].score+=delta;
    const li=[...next.history.keys()].filter(i=>next.history[i].pid===player.id).pop();
    if(li!==undefined){
      if(!next.history[li].corr)next.history[li].corr=[];
      if(!next.history[li].sac)next.history[li].sac=[];
      next.history[li].corr.push(delta);next.history[li].sac.push(next.players[pi].score);
    }else{
      next.history.push({pid:player.id,delta:0,sa:next.players[pi].score,corr:[delta],sac:[next.players[pi].score]});
    }
    setCorrectP(null);await push(next);
  }

  async function saveEdit(edited){
    const next=JSON.parse(JSON.stringify(gs));
    const pi=next.players.findIndex(p=>p.id===edited.id);
    if(pi>=0)next.players[pi]={...next.players[pi],...edited};
    // Also update global profile
    await saveProfile(edited);
    setEditP(null);await push(next);
  }

  const{players,goal}=gs,n=players.length;
  const useGrid=n>=4,cols2=useGrid?2:1;
  function buildSlots(){
    const seen=new Set(),slots=[];
    for(let i=0;i<players.length;i++){
      if(seen.has(players[i].id))continue;
      const p=players[i];
      if(p.teamId){const q=players.find(x=>x.id===p.teamId&&!seen.has(x.id));if(q){slots.push({p,tm:q});seen.add(p.id);seen.add(q.id);continue;}}
      slots.push({p,tm:null});seen.add(p.id);
    }
    return slots;
  }
  const slots=buildSlots(),rows=Math.ceil(slots.length/cols2),bs=n<=2?64:n<=3?56:48;

  return(
    <div style={{height:"100dvh",display:"flex",flexDirection:"column",background:"#0d0d0d",padding:"5px 5px 0",gap:5,fontFamily:F,overflow:"hidden"}}>
      {toast&&<div style={{position:"fixed",top:"50%",left:"50%",transform:"translate(-50%,-50%)",background:toast.c,color:fg(toast.c),padding:"10px 24px",borderRadius:12,fontWeight:800,fontSize:16,zIndex:800,pointerEvents:"none",animation:"toastPop .7s ease-out forwards",fontFamily:F}}>{toast.msg}</div>}

      {goal>0&&<div style={{display:"flex",gap:4,flexShrink:0,height:8,borderRadius:4,overflow:"hidden"}}>
        {players.map(p=>{const pct=Math.min(100,Math.max(0,(p.score/goal)*100));return<div key={p.id} style={{flex:1,background:"#1a1a1a",borderRadius:2,overflow:"hidden"}}><div style={{width:`${pct}%`,height:"100%",background:p.bc,transition:"width .4s"}}/></div>;})}
      </div>}

      <div style={{flex:1,minHeight:0,display:"grid",gridTemplateColumns:useGrid?"1fr 1fr":"1fr",gridTemplateRows:`repeat(${rows},1fr)`,gap:5}}>
        {slots.map(({p,tm})=>{
          const leaderScore=Math.max(...players.map(x=>x.score));
          const isLeader=players.length>1&&p.score===leaderScore&&p.score>0;
          return(
            <Panel key={p.id} player={p} onPlus={()=>addPoint(p,1)} onMinus={()=>addPoint(p,-1)}
              onLong={()=>setEditP(p)} teamMate={tm} ballSize={bs}
              onScoreTap={target=>setCorrectP(target)} isLeader={isLeader}/>
          );
        })}
      </div>

      <div style={{display:"flex",gap:5,paddingBottom:"max(7px,env(safe-area-inset-bottom))",flexShrink:0}}>
        <button onClick={()=>setShowHist(true)} style={{flex:.65,background:"#1a1a1a",color:"#666",border:"none",borderRadius:11,padding:"12px 0",fontSize:16,cursor:"pointer"}}>📋</button>
        <button onClick={handleUndo} style={{flex:1.4,background:"#1a1a1a",color:"#9B59B6",border:"none",borderRadius:11,padding:"12px 0",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:F}}>↩ Annuler</button>
        <button onClick={handleEndGame} style={{flex:2,background:"#1a1a1a",color:"#E63946",border:"1px solid #E6394644",borderRadius:11,padding:"12px 0",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:F}}>⏹ Fin</button>
        <button onClick={async()=>{if(!confirm("Réinitialiser les scores ?"))return;const next=JSON.parse(JSON.stringify(gs));next.players=next.players.map(p=>({...p,score:0}));next.history=[];await push(next);}} style={{flex:.55,background:"#1a1a1a",color:"#444",border:"none",borderRadius:11,padding:"12px 0",fontSize:14,cursor:"pointer"}}>↺</button>
      </div>

      {showHist&&<ScoreHistPanel history={gs.history||[]} players={players} onClose={()=>setShowHist(false)}/>}
      {correctP&&<CorrectModal player={correctP} onApply={d=>applyCorrection(correctP,d)} onCancel={()=>setCorrectP(null)}/>}
      {editP&&<ProfileEditor profile={editP} allProfiles={players} onSave={saveEdit} onCancel={()=>setEditP(null)}/>}
      {victor&&<Victory player={victor} goal={goal} onDismiss={()=>setVictor(null)}/>}
    </div>
  );
}

// ── Root ──────────────────────────────────────────────────────────────────────
function App(){
  const[screen,setScreen]=useState('loading'); // 'loading' | 'select' | 'game'
  const[gameState,setGameState]=useState(null);

  useEffect(()=>{
    initFB();
    loadGameState().then(gs=>{
      // If there's an active game with players, go straight to game
      if(gs&&gs.players&&gs.players.length>=2&&gs.v>0){
        setGameState(gs);setScreen('game');
      }else{
        setScreen('select');
      }
    });
  },[]);

  async function handleStart(players,goal){
    const gs=mkGameState(players,goal);
    await saveGameState(gs);
    setGameState(gs);setScreen('game');
  }

  function handleExit(){
    setGameState(null);setScreen('select');
  }

  if(screen==='loading') return(
    <div style={{height:"100dvh",background:"#0d0d0d",display:"flex",alignItems:"center",justifyContent:"center",color:"#FFD700",fontFamily:F,fontSize:22,fontWeight:900,letterSpacing:3}}>🎱 SCOREKEEPER</div>
  );
  if(screen==='select') return <SelectionScreen onStart={handleStart}/>;
  return <Game initialState={gameState} onExit={handleExit}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
