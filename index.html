// ── Scorekeeper Billard — app.js ──────────────────────────────────────────────
// React 18 + Firebase Realtime Database

const { useState, useEffect, useRef } = React;

// ── Firebase sync ─────────────────────────────────────────────────────────────
let _db = null;
let _dbRef = null;

function initFirebase() {
  try {
    firebase.app(); // already initialized
  } catch(e) {
    firebase.initializeApp(FIREBASE_CONFIG);
  }
  _db = firebase.database();
  _dbRef = _db.ref(`rooms/${ROOM_ID}/state`);
}

async function loadState() {
  return new Promise(resolve => {
    if(!_dbRef){ resolve(null); return; }
    _dbRef.once('value', snap => {
      resolve(snap.exists() ? snap.val() : null);
    }, () => resolve(null));
  });
}

async function saveState(s) {
  if(!_dbRef) return;
  try { await _dbRef.set(s); } catch(_) {}
}

function subscribeState(callback) {
  if(!_dbRef) return ()=>{};
  const handler = snap => {
    if(snap.exists()) callback(snap.val());
  };
  _dbRef.on('value', handler);
  return () => _dbRef.off('value', handler);
}

// ── Audio engine ──────────────────────────────────────────────────────────────
let _actx = null;
function getCtx(){
  if(!_actx) try{ _actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(_){}
  if(_actx?.state==='suspended') _actx.resume();
  return _actx;
}
function playPositivePing(){
  const ctx=getCtx();if(!ctx)return;
  const t=ctx.currentTime,osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(660,t);
  osc.frequency.exponentialRampToValueAtTime(1320,t+0.06);
  gain.gain.setValueAtTime(0,t);
  gain.gain.linearRampToValueAtTime(0.45,t+0.01);
  gain.gain.exponentialRampToValueAtTime(0.001,t+0.55);
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start(t);osc.stop(t+0.55);
}
function playNegativeBuzz(){
  const ctx=getCtx();if(!ctx)return;
  [0,0.20].forEach(offset=>{
    const t=ctx.currentTime+offset,osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.type='sawtooth';
    osc.frequency.setValueAtTime(160,t);
    osc.frequency.exponentialRampToValueAtTime(100,t+0.12);
    gain.gain.setValueAtTime(0,t);
    gain.gain.linearRampToValueAtTime(0.40,t+0.01);
    gain.gain.exponentialRampToValueAtTime(0.001,t+0.13);
    osc.connect(gain);gain.connect(ctx.destination);
    osc.start(t);osc.stop(t+0.14);
  });
}

// ── TTS ───────────────────────────────────────────────────────────────────────
let _voices=[];
function loadVoices(){ _voices=window.speechSynthesis?.getVoices()||[]; }
window.speechSynthesis?.addEventListener('voiceschanged',loadVoices);
setTimeout(loadVoices,300);

function frenchVoice(){
  const fr=_voices.filter(v=>v.lang.startsWith('fr'));
  return fr.find(v=>/thomas|nicolas|pierre|male/i.test(v.name))
      ||fr.find(v=>!/amelie|aurelie|female|femme/i.test(v.name))
      ||fr[0]||null;
}
function speak(text,onEnd){
  if(!window.speechSynthesis){onEnd?.();return;}
  window.speechSynthesis.cancel();
  const utt=new SpeechSynthesisUtterance(text);
  utt.lang='fr-FR';utt.rate=1.05;utt.pitch=1.0;
  const v=frenchVoice();if(v)utt.voice=v;
  utt.onend=()=>onEnd?.();
  utt.onerror=()=>onEnd?.();
  window.speechSynthesis.speak(utt);
}

function numFr(n){
  const w=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix',
           'onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf','vingt'];
  return(n>=0&&n<w.length)?w[n]:String(n);
}
function deltaFr(delta){
  const abs=Math.abs(delta),word=abs<=20?numFr(abs):String(abs);
  if(delta===1)return'un point';
  if(delta>0)return`${word} points`;
  return`moins ${word}`;
}
function totalFr(score){
  const abs=Math.abs(score),word=abs<=20?numFr(abs):String(abs);
  return score<0?`moins ${word}`:word;
}
function playTapAudio(player,delta,newScore){
  const positive=delta>0,steps=[];
  if(player.sndPing!==false)steps.push('ping');
  if(player.sndNum!==false)steps.push('num');
  if(player.sndName!==false)steps.push('name');
  if(player.sndTotal!==false)steps.push('total');
  if(!steps.length)return;
  let i=0;
  function next(){
    if(i>=steps.length)return;
    const step=steps[i++];
    if(step==='ping'){if(positive){playPositivePing();setTimeout(next,560);}else{playNegativeBuzz();setTimeout(next,420);}}
    else if(step==='num')speak(deltaFr(delta),next);
    else if(step==='name')speak(player.name,next);
    else if(step==='total')speak(totalFr(newScore),next);
  }
  next();
}

// ── Color helpers ─────────────────────────────────────────────────────────────
function h2r(hex){return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];}
function r2h(r,g,b){return"#"+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,"0")).join("");}
function lum(hex){const[r,g,b]=h2r(hex);return(.299*r+.587*g+.114*b)/255;}
function fg(hex){return lum(hex)>.48?"#111":"#fff";}
function dk(hex,f=.55){const[r,g,b]=h2r(hex);return r2h(r*f,g*f,b*f);}
function mute(hex){const[r,g,b]=h2r(hex);return r2h(r*.28+10,g*.28+10,b*.28+10);}
function h2v(hex){let[r,g,b]=h2r(hex);r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0,s=mx?d/mx:0,v=mx;if(d){if(mx===r)h=((g-b)/d+6)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}return[h,s,v];}
function v2h(h,s,v){const i=Math.floor(h/60)%6,f=h/60-Math.floor(h/60),p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);const[r,g,b]=[[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i];return r2h(r*255,g*255,b*255);}

const FELTS=["#1B5E20","#0D3B6E","#7B1113","#7B3A00","#00514A","#3E2723"];
let _uid=100;
function mkPlayer(i){const b=BALLS[i%BALLS.length];return{id:_uid++,name:`Joueur ${i+1}`,bc:b.c,fc:FELTS[i%FELTS.length],stripe:b.s,bn:b.num,photo:null,score:0,teamId:null,sndPing:true,sndNum:true,sndName:true,sndTotal:true};}

// ── Ball SVG ──────────────────────────────────────────────────────────────────
function Ball({c,stripe,num,photo,size=56,rolling=false}){
  const r=size/2;
  const uid=`b${(c||"0").replace(/\W/g,"")}-${num}-${size}-${rolling?1:0}`;
  const mr=r*.36,fs=num>=10?(size<32?size*.24:size*.27):(size<32?size*.30:size*.33);
  const bY1=r*.28,bY2=r*1.72,ry=r*.19,sz=size;
  const sp=[`M 0 ${bY1}`,`A ${r} ${ry} 0 0 1 ${sz} ${bY1}`,`L ${sz} ${bY2}`,`A ${r} ${ry} 0 0 0 0 ${bY2}`,`Z`].join(" ");
  const wobId=`wob-${uid}`;
  const TILT=40;

  if(photo) return(
    <div style={{width:size,height:size,borderRadius:"50%",overflow:"hidden",flexShrink:0,
      outline:`${Math.max(2,size*.05)}px solid ${c}`,outlineOffset:`${-Math.max(2,size*.05)}px`,background:"#111"}}>
      <img src={photo} alt="" style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>
    </div>
  );

  return(
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:"block",flexShrink:0}}>
      {rolling&&(
        <style>{`@keyframes ${wobId}{0%,100%{transform:translateY(0)}25%{transform:translateY(-${size*.04}px) translateX(${size*.04}px)}75%{transform:translateY(${size*.02}px) translateX(-${size*.02}px)}}`}</style>
      )}
      <defs>
        <clipPath id={`${uid}-cl`}><circle cx={r} cy={r} r={r-.5}/></clipPath>
        <radialGradient id={`${uid}-sp`} cx="34%" cy="28%" r="42%" gradientUnits="objectBoundingBox">
          <stop offset="0%" stopColor="rgba(255,255,255,.70)"/>
          <stop offset="30%" stopColor="rgba(255,255,255,.14)"/>
          <stop offset="100%" stopColor="rgba(0,0,0,0)"/>
        </radialGradient>
        <radialGradient id={`${uid}-ao`} cx="50%" cy="50%" r="50%" gradientUnits="objectBoundingBox">
          <stop offset="76%" stopColor="rgba(0,0,0,0)"/>
          <stop offset="100%" stopColor="rgba(0,0,0,.42)"/>
        </radialGradient>
        <radialGradient id={`${uid}-sh`} cx="50%" cy="90%" r="55%" gradientUnits="objectBoundingBox">
          <stop offset="0%" stopColor="rgba(0,0,0,.28)"/>
          <stop offset="100%" stopColor="rgba(0,0,0,0)"/>
        </radialGradient>
      </defs>
      <g style={rolling?{animation:`${wobId} 2.2s ease-in-out infinite`}:{}}>
        <g clipPath={`url(#${uid}-cl)`}>
          <rect x={0} y={0} width={size} height={size} fill={stripe?"#F5F0E8":c}/>
          {rolling?(
            <g transform={`rotate(${TILT} ${r} ${r})`}>
              <g>
                <animateTransform attributeName="transform" type="rotate"
                  from={`0 ${r} ${r}`} to={`360 ${r} ${r}`}
                  dur="3s" repeatCount="indefinite" calcMode="linear"/>
                <g transform={`rotate(${-TILT} ${r} ${r})`}>
                  {stripe&&<path d={sp} fill={c}/>}
                  <circle cx={r} cy={r} r={mr} fill="#F8F5EE"/>
                  <text x={r} y={r} textAnchor="middle" dominantBaseline="central"
                    fontSize={fs} fontWeight="700" fill="#1a0808"
                    fontFamily="Georgia,'Times New Roman',serif"
                    letterSpacing={num>=10?"-0.5":"0"}>{num}</text>
                </g>
              </g>
            </g>
          ):(
            <>
              {stripe&&<path d={sp} fill={c}/>}
              <circle cx={r} cy={r} r={mr} fill="#F8F5EE"/>
              <text x={r} y={r} textAnchor="middle" dominantBaseline="central"
                fontSize={fs} fontWeight="700" fill="#1a0808"
                fontFamily="Georgia,'Times New Roman',serif"
                letterSpacing={num>=10?"-0.5":"0"}>{num}</text>
            </>
          )}
          <rect x={0} y={0} width={size} height={size} fill={`url(#${uid}-sh)`}/>
          <rect x={0} y={0} width={size} height={size} fill={`url(#${uid}-ao)`}/>
          <rect x={0} y={0} width={size} height={size} fill={`url(#${uid}-sp)`}/>
        </g>
        <circle cx={r} cy={r} r={r-.5} fill="none" stroke="rgba(0,0,0,.22)" strokeWidth="1.5"/>
      </g>
    </svg>
  );
}

// ── Rail ──────────────────────────────────────────────────────────────────────
function Rail({fc,top}){
  const rc=dk(fc,.46),dc=dk(fc,.58),H=12,br=top?"12px 12px 0 0":"0 0 12px 12px";
  return(
    <div style={{flexShrink:0,height:H,background:rc,borderRadius:br,position:"relative",zIndex:2}}>
      {[.2,.38,.5,.62,.8].map(x=><div key={x} style={{width:3,height:3,borderRadius:"50%",background:dc,position:"absolute",top:"50%",left:`${x*100}%`,transform:"translate(-50%,-50%)"}}/>)}
      {[0,1].map(s=><div key={s} style={{position:"absolute",[s?"right":"left"]:0,[top?"top":"bottom"]:0,width:H*1.3,height:H*1.3,background:"#0a0a0a",zIndex:3,borderRadius:top?(s?"0 0 0 100%":"0 0 100% 0"):(s?"100% 0 0 0":"0 100% 0 0")}}/>)}

}

// ── Color Wheel ───────────────────────────────────────────────────────────────
function Wheel({color,onChange}){
  const cr=useRef(null),sr=useRef(null);
  const[hsv,setHsv]=useState(()=>h2v(color||"#1B5E20"));
  const dw=useRef(false),ds=useRef(false);
  const SZ=192,CX=96,CY=96,OR=94,IR=66,SQ=IR*1.36;
  useEffect(()=>{
    const c=cr.current;if(!c)return;const ctx=c.getContext("2d");ctx.clearRect(0,0,SZ,SZ);
    for(let d=0;d<360;d++){const a0=(d-1)*Math.PI/180,a1=(d+1)*Math.PI/180;ctx.beginPath();ctx.moveTo(CX,CY);ctx.arc(CX,CY,OR,a0,a1);ctx.closePath();ctx.fillStyle=v2h(d,1,1);ctx.fill();}
    ctx.globalCompositeOperation="destination-out";ctx.beginPath();ctx.arc(CX,CY,IR,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation="source-over";
  },[]);
  useEffect(()=>{
    const c=sr.current;if(!c)return;const ctx=c.getContext("2d"),N=SQ;
    const gH=ctx.createLinearGradient(0,0,N,0);gH.addColorStop(0,"#fff");gH.addColorStop(1,v2h(hsv[0],1,1));ctx.fillStyle=gH;ctx.fillRect(0,0,N,N);
    const gV=ctx.createLinearGradient(0,0,0,N);gV.addColorStop(0,"rgba(0,0,0,0)");gV.addColorStop(1,"rgba(0,0,0,1)");ctx.fillStyle=gV;ctx.fillRect(0,0,N,N);
  },[hsv[0]]);
  const set=(h)=>{setHsv(h);onChange(v2h(...h));};
  const hue=(e)=>{const rect=cr.current.getBoundingClientRect(),cx=(e.clientX??e.touches?.[0]?.clientX)-rect.left-CX,cy=(e.clientY??e.touches?.[0]?.clientY)-rect.top-CY;let a=Math.atan2(cy,cx)*180/Math.PI;return a<0?a+360:a;};
  const sv=(e)=>{const rect=sr.current.getBoundingClientRect(),x=Math.max(0,Math.min(SQ,(e.clientX??e.touches?.[0]?.clientX)-rect.left)),y=Math.max(0,Math.min(SQ,(e.clientY??e.touches?.[0]?.clientY)-rect.top));return[x/SQ,1-y/SQ];};
  useEffect(()=>{const up=()=>{dw.current=false;ds.current=false;};window.addEventListener("mouseup",up);window.addEventListener("touchend",up);return()=>{window.removeEventListener("mouseup",up);window.removeEventListener("touchend",up);};},[]);
  const hrad=hsv[0]*Math.PI/180,hm=(OR+IR)/2,hx=CX+hm*Math.cos(hrad),hy=CY+hm*Math.sin(hrad);
  const sx2=hsv[1]*SQ,sy2=(1-hsv[2])*SQ;
  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:10,userSelect:"none",WebkitUserSelect:"none"}}>
      <div style={{position:"relative",width:SZ,height:SZ,touchAction:"none"}}
        onMouseDown={e=>{e.preventDefault();dw.current=true;set([hue(e),hsv[1],hsv[2]]);}}
        onMouseMove={e=>{if(!dw.current)return;e.preventDefault();set([hue(e),hsv[1],hsv[2]]);}}
        onTouchStart={e=>{e.preventDefault();dw.current=true;set([hue(e),hsv[1],hsv[2]]);}}
        onTouchMove={e=>{if(!dw.current)return;e.preventDefault();set([hue(e),hsv[1],hsv[2]]);}}>
        <canvas ref={cr} width={SZ} height={SZ} style={{position:"absolute",top:0,left:0}}/>
        <div style={{position:"absolute",left:hx-8,top:hy-8,width:16,height:16,borderRadius:"50%",border:"2.5px solid #fff",background:v2h(hsv[0],1,1),pointerEvents:"none"}}/>
        <div style={{position:"absolute",left:CX-SQ/2,top:CY-SQ/2,width:SQ,height:SQ,borderRadius:5,overflow:"hidden",touchAction:"none"}}
          onMouseDown={e=>{e.stopPropagation();e.preventDefault();ds.current=true;const[s,v]=sv(e);set([hsv[0],s,v]);}}
          onMouseMove={e=>{if(!ds.current)return;e.stopPropagation();e.preventDefault();const[s,v]=sv(e);set([hsv[0],s,v]);}}
          onTouchStart={e=>{e.stopPropagation();e.preventDefault();ds.current=true;const[s,v]=sv(e);set([hsv[0],s,v]);}}
          onTouchMove={e=>{if(!ds.current)return;e.stopPropagation();e.preventDefault();const[s,v]=sv(e);set([hsv[0],s,v]);}}>
          <canvas ref={sr} width={SQ} height={SQ} style={{display:"block"}}/>
          <div style={{position:"absolute",left:sx2-6,top:sy2-6,width:12,height:12,borderRadius:"50%",border:"2px solid #fff",background:v2h(...hsv),pointerEvents:"none"}}/>
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <div style={{width:28,height:28,borderRadius:7,background:v2h(...hsv),border:"2px solid #ffffff22"}}/>
        <input value={v2h(...hsv)} onChange={e=>{if(/^#[0-9a-fA-F]{6}$/.test(e.target.value))set(h2v(e.target.value));}}
          style={{background:"#1a1a1a",border:"1px solid #333",borderRadius:7,color:"#ccc",fontSize:13,padding:"5px 8px",fontFamily:"monospace",width:78,outline:"none"}}/>
      </div>

// ── Photo Crop ────────────────────────────────────────────────────────────────
function CropModal({onDone,onCancel}){
  const SZ=230;
  const[src,setSrc]=useState(null),[nat,setNat]=useState({w:1,h:1});
  const xr=useRef({x:0,y:0,scale:1}),[xf,setXf]=useState({x:0,y:0,scale:1});
  const cvr=useRef(null),imgr=useRef(null),contr=useRef(null);
  const drg=useRef(false),lm=useRef(null),lpd=useRef(null),lpm=useRef(null);
  const ax=(n)=>{n.scale=Math.max(1,Math.min(8,n.scale));xr.current=n;setXf({...n});};
  const onLoad=()=>ax({x:0,y:0,scale:1});
  const onFile=(e)=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=ev=>{setSrc(ev.target.result);ax({x:0,y:0,scale:1});};rd.readAsDataURL(f);};
  const mdown=(e)=>{e.preventDefault();drg.current=true;lm.current={x:e.clientX,y:e.clientY};if(contr.current)contr.current.style.cursor="grabbing";};
  const mmove=(e)=>{if(!drg.current)return;e.preventDefault();const dx=e.clientX-lm.current.x,dy=e.clientY-lm.current.y;lm.current={x:e.clientX,y:e.clientY};ax({...xr.current,x:xr.current.x+dx,y:xr.current.y+dy});};
  const mup=()=>{drg.current=false;if(contr.current)contr.current.style.cursor="grab";};
  const wheel=(e)=>{e.preventDefault();ax({...xr.current,scale:xr.current.scale*(e.deltaY<0?1.1:.92)});};
  const md2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),mp2=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
  const ta=(e)=>Array.from(e.touches).map(t=>({x:t.clientX,y:t.clientY}));
  const tdown=(e)=>{e.preventDefault();const ts=ta(e);if(ts.length===1){drg.current=true;lm.current=ts[0];lpd.current=null;}else if(ts.length===2){drg.current=false;lpd.current=md2(ts[0],ts[1]);lpm.current=mp2(ts[0],ts[1]);}};
  const tmove=(e)=>{e.preventDefault();const ts=ta(e);if(ts.length===1&&drg.current){const dx=ts[0].x-lm.current.x,dy=ts[0].y-lm.current.y;lm.current=ts[0];ax({...xr.current,x:xr.current.x+dx,y:xr.current.y+dy});}else if(ts.length===2){const d=md2(ts[0],ts[1]),m=mp2(ts[0],ts[1]);if(lpd.current){const f=d/lpd.current;ax({x:xr.current.x+(m.x-lpm.current.x),y:xr.current.y+(m.y-lpm.current.y),scale:xr.current.scale*f});}lpd.current=d;lpm.current=m;}};
  const tend=(e)=>{if(!e.touches.length){drg.current=false;lpd.current=null;}else if(e.touches.length===1){lpd.current=null;drg.current=true;lm.current={x:e.touches[0].clientX,y:e.touches[0].clientY};}};
  useEffect(()=>{window.addEventListener("mouseup",mup);return()=>window.removeEventListener("mouseup",mup);},[]);
  const crop=()=>{
    const cv=cvr.current,ctx=cv.getContext("2d"),img=imgr.current;
    cv.width=SZ;cv.height=SZ;ctx.clearRect(0,0,SZ,SZ);
    const{x,y,scale}=xr.current;
    ctx.save();ctx.translate(SZ/2+x,SZ/2+y);ctx.scale(scale,scale);ctx.drawImage(img,-SZ/2,-SZ/2,SZ,SZ);ctx.restore();
    onDone(cv.toDataURL("image/jpeg",.88));
  };
  return(
    <div style={{position:"fixed",inset:0,background:"#000d",zIndex:700,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14,fontFamily:F}}>
      <div style={{color:"#FFD700",fontSize:15,fontWeight:700,letterSpacing:2}}>RECADRER</div>
      {!src
        ?<label style={{background:"#1a1a1a",border:"2px dashed #333",borderRadius:16,padding:"30px 40px",color:"#666",cursor:"pointer",fontSize:14,textAlign:"center",lineHeight:1.8}}>
            📷<br/>Choisir une photo<input type="file" accept="image/*" onChange={onFile} style={{display:"none"}}/>
          </label>
        :<>
          <div ref={contr} onMouseDown={mdown} onMouseMove={mmove} onTouchStart={tdown} onTouchMove={tmove} onTouchEnd={tend} onWheel={wheel}
            style={{position:"relative",width:SZ,height:SZ,borderRadius:"50%",overflow:"hidden",background:"#222",cursor:"grab",touchAction:"none",outline:"3px solid #FFD700",flexShrink:0}}>
            <img ref={imgr} src={src} alt="" onLoad={onLoad} draggable={false}
              style={{position:"absolute",width:"100%",height:"100%",objectFit:"cover",left:0,top:0,
                transform:`translate(${xf.x}px,${xf.y}px) scale(${xf.scale})`,
                transformOrigin:"center center",pointerEvents:"none",userSelect:"none"}}/>
          </div>
          <div style={{color:"#555",fontSize:11}}>Glisser · Pincer pour zoomer</div>
        </>
      }
      <div style={{display:"flex",gap:10}}>
        <button onClick={onCancel} style={{background:"#222",color:"#777",border:"none",borderRadius:10,padding:"10px 22px",fontSize:14,cursor:"pointer",fontFamily:F}}>Annuler</button>
        {src&&<button onClick={crop} style={{background:"#FFD700",color:"#111",border:"none",borderRadius:10,padding:"10px 22px",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:F}}>Utiliser</button>}
      </div>
      <canvas ref={cvr} style={{display:"none"}}/>
    </div>
  );
}

      <div style={{display:"flex",borderBottom:"1px solid #222",flexShrink:0}}>
        {players.map(p=>(
          <div key={p.id} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",padding:"7px 3px 6px",gap:3,borderRight:"1px solid #1a1a1a"}}>
            <Ball c={p.bc} stripe={p.stripe} num={p.bn||1} photo={p.photo} size={24}/>
            <div style={{color:p.fc,fontSize:9,fontWeight:700,textTransform:"uppercase",textAlign:"center",maxWidth:60,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{p.name}</div>
            <div style={{color:"#FFD700",fontSize:13,fontWeight:800}}>{p.score}</div>
          </div>
        ))}
      </div>
      <div style={{flex:1,overflowY:"auto"}}>
        {maxRows===0&&<div style={{color:"#333",textAlign:"center",marginTop:60,fontSize:14}}>Aucun point marqué</div>}
        {Array.from({length:maxRows}).map((_,rowIdx)=>(
          <div key={rowIdx} style={{display:"flex",borderBottom:"1px solid #161616",minHeight:28}}>
            {cols.map(({player:p,entries})=>{
              const entry=entries[entries.length-1-rowIdx];
              return(
                <div key={p.id} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"3px 2px",borderRight:"1px solid #1a1a1a",background:entry?p.fc+"18":"transparent"}}>
                  {entry&&(
                    <>
                      <span style={{color:entry.delta>0?"#06D6A0":"#E63946",fontSize:13,fontWeight:800}}>{entry.delta>0?`+${entry.delta}`:entry.delta}</span>
                      <span style={{color:"#444",fontSize:9}}>→ {entry.sa}</span>
                      {(entry.corr||[]).map((c,ci)=><span key={ci} style={{color:"#9B59B6",fontSize:9,fontWeight:700}}>[{c>0?"+":""}{c}]→{(entry.sac||[])[ci]}</span>)}
                    </>
                  )}
                </div>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Toggle Switch ─────────────────────────────────────────────────────────────
function Toggle({on,onChange,label}){
  return(
    <div style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer"}} onClick={()=>onChange(!on)}>
      <span style={{color:"#888",fontSize:11,fontWeight:600,fontFamily:F,letterSpacing:.5,minWidth:44,textAlign:"right"}}>{label}</span>
      <div style={{width:38,height:22,borderRadius:11,background:on?"#FFD700":"#333",position:"relative",transition:"background .2s",flexShrink:0}}>
        <div style={{position:"absolute",top:3,left:on?18:3,width:16,height:16,borderRadius:"50%",background:on?"#111":"#666",transition:"left .2s"}}/>
      </div>
    </div>
  );
}

// ── SetupCard ─────────────────────────────────────────────────────────────────
function SetupCard({player,onChange,onRemove,canRemove,allPlayers,compact=false}){
  const felt=player.fc||"#1B5E20",tfg=fg(felt);
  const[showCrop,setShowCrop]=useState(false),[showFelt,setShowFelt]=useState(false),[showBalls,setShowBalls]=useState(false);
  const teammates=allPlayers.filter(p=>p.id!==player.id);
  const inputBorder=tfg==="#fff"?"rgba(255,255,255,.4)":"rgba(0,0,0,.3)";
  return(
    <div style={{width:"100%",borderRadius:12,overflow:"hidden",fontFamily:F}}>
      {showCrop&&<CropModal onDone={ph=>{onChange("photo",ph);setShowCrop(false);}} onCancel={()=>setShowCrop(false)}/>}
      {showFelt&&<WheelModal title="COULEUR TAPIS" color={player.fc} onDone={c=>{onChange("fc",c);setShowFelt(false);}} onCancel={()=>setShowFelt(false)}/>}
      <Rail fc={felt} top={true}/>
      <div style={{background:felt,padding:"10px 12px 12px",display:"flex",flexDirection:"column",gap:10}}>
        {canRemove&&<div style={{display:"flex",justifyContent:"flex-end"}}>
          <button onClick={onRemove} style={{background:"rgba(0,0,0,.2)",border:"none",borderRadius:7,color:tfg==="#fff"?"rgba(255,150,150,.9)":"rgba(180,0,0,.9)",padding:"2px 10px",fontSize:11,cursor:"pointer",fontFamily:F}}>✕ Retirer</button>
        </div>}
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{cursor:"pointer",flexShrink:0,position:"relative"}} onClick={()=>player.photo?setShowCrop(true):setShowBalls(v=>!v)}>
            <Ball c={player.bc} stripe={player.stripe} num={player.bn||1} photo={player.photo} size={compact?46:56}/>
            <div style={{position:"absolute",bottom:-2,right:-2,background:"#FFD700",borderRadius:"50%",width:15,height:15,fontSize:9,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700}}>{player.photo?"📷":"🎱"}</div>
          </div>
          <div style={{flex:1,display:"flex",flexDirection:"column",gap:4}}>
            <input value={player.name} maxLength={14} onChange={e=>onChange("name",e.target.value)}
              style={{width:"100%",background:"transparent",border:"none",borderBottom:`2px solid ${inputBorder}`,color:tfg,fontSize:compact?17:20,fontWeight:700,fontFamily:F,outline:"none",padding:"2px 0"}}/>
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>setShowCrop(true)} style={{background:"rgba(0,0,0,.18)",border:"none",borderRadius:6,color:tfg,padding:"3px 8px",fontSize:10,cursor:"pointer",fontFamily:F}}>📷 Photo</button>
              {player.photo&&<button onClick={()=>onChange("photo",null)} style={{background:"rgba(0,0,0,.18)",border:"none",borderRadius:6,color:tfg,opacity:.7,padding:"3px 8px",fontSize:10,cursor:"pointer",fontFamily:F}}>✕</button>}
            </div>
          </div>
        </div>
        {showBalls&&(
          <div style={{display:"flex",flexWrap:"wrap",gap:6,padding:"8px",background:"rgba(0,0,0,.18)",borderRadius:10}}>
            {BALLS.map(b=>(
              <div key={b.num} onClick={()=>{onChange("bc",b.c);onChange("stripe",b.s);onChange("bn",b.num);setShowBalls(false);}}
                style={{cursor:"pointer",transform:player.bn===b.num?"scale(1.18)":"scale(1)",transition:"transform .1s"}}>
                <Ball c={b.c} stripe={b.s} num={b.num} size={34}/>
              </div>
            ))}
          </div>
        )}
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div onClick={()=>setShowFelt(true)} style={{cursor:"pointer",display:"flex",alignItems:"center",gap:7,background:"rgba(0,0,0,.18)",borderRadius:9,padding:"6px 10px"}}>
            <div style={{width:26,height:14,borderRadius:4,background:player.fc}}/>
            <span style={{color:tfg,fontSize:11,fontWeight:600}}>Tapis ▸</span>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
          <span style={{color:tfg,opacity:.5,fontSize:10,textTransform:"uppercase",letterSpacing:.5}}>Équipe:</span>
          <button onClick={()=>onChange("teamId",null)} style={{background:player.teamId===null?"rgba(255,215,0,.28)":"rgba(0,0,0,.18)",border:"none",borderRadius:7,color:player.teamId===null?"#FFD700":tfg,padding:"3px 9px",fontSize:11,cursor:"pointer",fontFamily:F}}>Solo</button>
          {teammates.map(t=>(
            <button key={t.id} onClick={()=>onChange("teamId",t.id)} style={{background:player.teamId===t.id?"rgba(255,255,255,.2)":"rgba(0,0,0,.18)",border:"none",borderRadius:7,color:tfg,padding:"3px 9px",fontSize:11,cursor:"pointer",fontFamily:F,display:"flex",alignItems:"center",gap:3}}>
              <Ball c={t.bc} stripe={t.stripe} num={t.bn||1} size={13}/>{t.name}
            </button>
          ))}
        </div>
      </div>
      <Rail fc={felt} top={false}/>
    </div>
  );
}

// ── Manager ───────────────────────────────────────────────────────────────────
function Manager({gs,onClose,onUpdate}){
  const[players,setPlayers]=useState(JSON.parse(JSON.stringify(gs.players)));
  const upd=(id,f,v)=>setPlayers(prev=>prev.map(p=>p.id===id?{...p,[f]:v}:p));
  const remove=(id)=>{if(players.length<=MIN_P){alert(`Minimum ${MIN_P}.`);return;}setPlayers(prev=>prev.filter(p=>p.id!==id));};
  const add=()=>{if(players.length>=MAX_P){alert(`Maximum ${MAX_P}.`);return;}setPlayers(prev=>[...prev,mkPlayer(prev.length)]);};
  async function apply(){const next=JSON.parse(JSON.stringify(gs));next.players=players;onUpdate(next);onClose();}
  return(
    <div style={{position:"fixed",inset:0,background:"#0d0d0df8",zIndex:400,display:"flex",flexDirection:"column",fontFamily:F,overflowY:"auto"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 14px 8px",borderBottom:"1px solid #222",position:"sticky",top:0,background:"#0d0d0d",zIndex:1}}>
        <div style={{color:"#FFD700",fontSize:14,fontWeight:700,letterSpacing:2}}>JOUEURS</div>
        <div style={{display:"flex",gap:6}}>
          {players.length<MAX_P&&<button onClick={add} style={{background:"#1e1e1e",border:"none",borderRadius:8,color:"#6ddb6d",padding:"5px 12px",fontSize:12,cursor:"pointer",fontFamily:F}}>+ Ajouter</button>}
          <button onClick={apply} style={{background:"#FFD700",color:"#111",border:"none",borderRadius:8,padding:"5px 14px",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:F}}>OK</button>
          <button onClick={onClose} style={{background:"#1e1e1e",border:"none",color:"#666",borderRadius:8,padding:"5px 12px",fontSize:13,cursor:"pointer",fontFamily:F}}>Annuler</button>
        </div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:9,padding:"9px 10px 24px"}}>
        {players.map(p=><SetupCard key={p.id} player={p} onChange={(f,v)=>upd(p.id,f,v)} onRemove={()=>remove(p.id)} canRemove={players.length>MIN_P} allPlayers={players} compact={true}/>)}
      </div>
    </div>
  );
}

// ── Setup Screen ──────────────────────────────────────────────────────────────
function Setup({state,onDone}){
  const[players,setPlayers]=useState(state.players?.length>=2?state.players:[mkPlayer(0),mkPlayer(1)]);
  const[goal,setGoal]=useState(state.goal||0);
  // Restore audio prefs from existing players if returning from a game
  const p0=state.players?.[0];
  const[sndPing,setSndPing]=useState(p0?.sndPing!==false);
  const[sndNum,setSndNum]=useState(p0?.sndNum!==false);
  const[sndName,setSndName]=useState(p0?.sndName!==false);
  const[sndTotal,setSndTotal]=useState(p0?.sndTotal!==false);
  const upd=(id,f,v)=>setPlayers(prev=>prev.map(p=>p.id===id?{...p,[f]:v}:p));
  const remove=(id)=>{if(players.length<=MIN_P)return;setPlayers(prev=>prev.filter(p=>p.id!==id));}
  const add=()=>{if(players.length>=MAX_P)return;setPlayers(prev=>[...prev,mkPlayer(prev.length)]);}
  async function start(){
    const stamped=players.map(p=>({...p,sndPing,sndNum,sndName,sndTotal}));
    const next={...mkState(goal),players:stamped,done:true,v:(state.v||0)+1,goal};
    await saveState(next);onDone(next);
  }
  return(
    <div style={{minHeight:"100dvh",background:"#0d0d0d",display:"flex",flexDirection:"column",alignItems:"center",padding:"max(20px,env(safe-area-inset-top)) 14px 32px",gap:12,overflowY:"auto",WebkitOverflowScrolling:"touch"}}>
      <div style={{color:"#FFD700",fontSize:22,fontWeight:900,letterSpacing:3,fontFamily:F}}>🎱 SCOREKEEPER</div>
      <div style={{color:"#444",fontSize:11,fontFamily:F,textAlign:"center",marginTop:-6}}>🎱 bille · 📷 photo · Tapis → couleur</div>
      <div style={{color:"#2a2a2a",fontSize:10,fontFamily:F,letterSpacing:1,marginTop:-4}}>v{VERSION}</div>
      <div style={{display:"flex",alignItems:"stretch",gap:8,width:"100%",maxWidth:400}}>
        <div style={{flex:1,display:"flex",alignItems:"center",gap:10,background:"#1a1a1a",borderRadius:12,padding:"10px 14px"}}>
          <div style={{color:"#FFD700",fontSize:13,fontWeight:700,fontFamily:F}}>🏆</div>
          <input type="number" min={0} value={goal||""} onChange={e=>setGoal(Math.max(0,parseInt(e.target.value)||0))}
            style={{flex:1,background:"transparent",border:"none",borderBottom:"2px solid #333",color:"#fff",fontSize:18,fontWeight:700,fontFamily:F,outline:"none",padding:"2px 0",textAlign:"right"}}/>
        </div>
        <div style={{background:"#1a1a1a",borderRadius:12,padding:"10px 14px",display:"flex",flexDirection:"column",gap:6,justifyContent:"center"}}>
          <Toggle on={sndPing} onChange={setSndPing} label="SON"/>
          <Toggle on={sndNum}  onChange={setSndNum}  label="POINT"/>
          <Toggle on={sndName} onChange={setSndName} label="NOM"/>
          <Toggle on={sndTotal} onChange={setSndTotal} label="TOTAL"/>
        </div>
      </div>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        {players.length<MAX_P&&<button onClick={add} style={{background:"#1e1e1e",border:"none",borderRadius:10,color:"#6ddb6d",padding:"7px 14px",fontSize:13,cursor:"pointer",fontFamily:F}}>+ Joueur</button>}
        <span style={{color:"#444",fontSize:11,fontFamily:F}}>{players.length} joueur{players.length>1?"s":""}</span>
      </div>
      {players.map(p=><SetupCard key={p.id} player={p} onChange={(f,v)=>upd(p.id,f,v)} onRemove={()=>remove(p.id)} canRemove={players.length>MIN_P} allPlayers={players}/>)}
      <button onClick={start} style={{background:"#FFD700",color:"#111",border:"none",borderRadius:12,padding:"14px 52px",fontSize:17,fontWeight:800,fontFamily:F,cursor:"pointer",marginTop:6}}>▶ Commencer</button>
    </div>
  );
}

// ── Game ──────────────────────────────────────────────────────────────────────
function Game({init}){
  const[gs,setGs]=useState(init);
  const[showHist,setShowHist]=useState(false);
  const[showMgr,setShowMgr]=useState(false);
  const[correctP,setCorrectP]=useState(null);
  const[editP,setEditP]=useState(null);
  const[toast,setToast]=useState(null);
  const[victor,setVictor]=useState(null);
  const vRef=useRef(init.v);
  const won=useRef(new Set());

  // Firebase realtime subscription (replaces polling)
  useEffect(()=>{
    const unsub=subscribeState(remote=>{
      if(remote&&remote.v>vRef.current){vRef.current=remote.v;setGs(remote);}
    });
    return unsub;
  },[]);

  async function push(next){
    next.v=(vRef.current||0)+1;vRef.current=next.v;
    if(next.goal>0&&!victor){
      for(const p of next.players){
        if(p.score>=next.goal&&!won.current.has(p.id)){won.current.add(p.id);setVictor({...p});break;}
      }
    }
    setGs(next);await saveState(next);
  }

  function toast_(msg,c="#FFD700"){setToast({msg,c});setTimeout(()=>setToast(null),700);}

  async function addPoint(player,delta){
    const next=JSON.parse(JSON.stringify(gs));
    const pi=next.players.findIndex(p=>p.id===player.id);if(pi<0)return;
    next.players[pi].score+=delta;
    const newScore=next.players[pi].score;
    next.history.push({pid:player.id,delta,sa:newScore,corr:[],sac:[]});
    playTapAudio(next.players[pi],delta,newScore);
    await push(next);
  }

  async function handleUndo(){
    const next=JSON.parse(JSON.stringify(gs));
    if(next.history.length){
      const last=next.history.pop(),tc=(last.corr||[]).reduce((a,b)=>a+b,0);
      const pi=next.players.findIndex(p=>p.id===last.pid);
      if(pi>=0)next.players[pi].score-=(last.delta+tc);
      toast_("Annulé","#9B59B6");
    }
    await push(next);
  }

  async function handleReset(){
    if(!confirm("Nouvelle partie ? Les scores seront remis à zéro."))return;
    // Go back to setup screen with current players preserved (scores zeroed)
    const next={...mkState(gs.goal),players:gs.players.map(p=>({...p,score:0})),done:false,v:(vRef.current||0)+1,goal:gs.goal,history:[]};
    won.current=new Set();vRef.current=next.v;setGs(next);await saveState(next);
  }

  async function applyCorrection(player,delta){
    const next=JSON.parse(JSON.stringify(gs));
    const pi=next.players.findIndex(p=>p.id===player.id);if(pi<0)return;
    next.players[pi].score+=delta;
    const li=[...next.history.keys()].filter(i=>next.history[i].pid===player.id).pop();
    if(li!==undefined){
      if(!next.history[li].corr)next.history[li].corr=[];
      if(!next.history[li].sac)next.history[li].sac=[];
      next.history[li].corr.push(delta);next.history[li].sac.push(next.players[pi].score);
    }else{
      next.history.push({pid:player.id,delta:0,sa:next.players[pi].score,corr:[delta],sac:[next.players[pi].score]});
    }
    setCorrectP(null);await push(next);
  }

  async function saveEdit(edited){
    const next=JSON.parse(JSON.stringify(gs));
    const pi=next.players.findIndex(p=>p.id===edited.id);
    if(pi>=0)next.players[pi]={...next.players[pi],...edited};
    setEditP(null);await push(next);
  }

  const{players,goal}=gs,n=players.length;
  const useGrid=n>=4,cols2=useGrid?2:1;
  function buildSlots(){
    const seen=new Set(),slots=[];
    for(let i=0;i<players.length;i++){
      if(seen.has(players[i].id))continue;
      const p=players[i];
      if(p.teamId){const q=players.find(x=>x.id===p.teamId&&!seen.has(x.id));if(q){slots.push({p,tm:q});seen.add(p.id);seen.add(q.id);continue;}}
      slots.push({p,tm:null});seen.add(p.id);
    }
    return slots;
  }
  const slots=buildSlots(),rows=Math.ceil(slots.length/cols2),bs=n<=2?64:n<=3?56:48;

  return(
    <div style={{height:"100dvh",display:"flex",flexDirection:"column",background:"#0d0d0d",padding:"5px 5px 0",gap:5,fontFamily:F,overflow:"hidden"}}>
      <style>{`@keyframes flashOut{0%{opacity:1}100%{opacity:0}}@keyframes toastPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.82)}30%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0}}`}</style>
      {toast&&<div style={{position:"fixed",top:"50%",left:"50%",transform:"translate(-50%,-50%)",background:toast.c,color:fg(toast.c),padding:"10px 24px",borderRadius:12,fontWeight:800,fontSize:16,zIndex:800,pointerEvents:"none",animation:"toastPop .7s ease-out forwards",fontFamily:F}}>{toast.msg}</div>}
      {goal>0&&<div style={{display:"flex",gap:4,flexShrink:0,height:8,borderRadius:4,overflow:"hidden"}}>
        {players.map(p=>{
          const pct=Math.min(100,Math.max(0,(p.score/goal)*100));
          return <div key={p.id} style={{flex:1,background:"#1a1a1a",borderRadius:2,overflow:"hidden"}}><div style={{width:`${pct}%`,height:"100%",background:p.bc,transition:"width .4s"}}/></div>;
        })}
      </div>}
      <div style={{flex:1,minHeight:0,display:"grid",gridTemplateColumns:useGrid?"1fr 1fr":"1fr",gridTemplateRows:`repeat(${rows},1fr)`,gap:5}}>
        {slots.map(({p,tm})=>{
          const leaderScore=Math.max(...players.map(x=>x.score));
          const isLeader=players.length>1&&p.score===leaderScore&&p.score>0;
          return(
            <Panel key={p.id} player={p}
              onPlus={()=>addPoint(p,1)} onMinus={()=>addPoint(p,-1)}
              onLong={()=>setEditP(p)} teamMate={tm} ballSize={bs}
              onScoreTap={target=>setCorrectP(target)} isLeader={isLeader}
            />
          );
        })}
      </div>
      <div style={{display:"flex",gap:5,paddingBottom:"max(7px,env(safe-area-inset-bottom))",flexShrink:0}}>
        <button onClick={()=>setShowHist(true)} style={{flex:.65,background:"#1a1a1a",color:"#666",border:"none",borderRadius:11,padding:"12px 0",fontSize:16,cursor:"pointer"}}>📋</button>
        <button onClick={()=>setShowMgr(true)} style={{flex:.65,background:"#1a1a1a",color:"#666",border:"none",borderRadius:11,padding:"12px 0",fontSize:16,cursor:"pointer"}}>👥</button>
        <button onClick={handleUndo} style={{flex:1.8,background:"#1a1a1a",color:"#9B59B6",border:"none",borderRadius:11,padding:"12px 0",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:F}}>↩ Annuler</button>
        <button onClick={handleReset} style={{flex:.55,background:"#1a1a1a",color:"#444",border:"none",borderRadius:11,padding:"12px 0",fontSize:14,cursor:"pointer"}}>↺</button>
      </div>
      {showHist&&<HistPanel history={gs.history} players={players} onClose={()=>setShowHist(false)}/>}
      {showMgr&&<Manager gs={gs} onClose={()=>setShowMgr(false)} onUpdate={next=>push(next)}/>}
      {correctP&&<CorrectModal player={correctP} onApply={d=>applyCorrection(correctP,d)} onCancel={()=>setCorrectP(null)}/>}
      {editP&&<EditModal player={editP} allPlayers={players} onSave={saveEdit} onCancel={()=>setEditP(null)}/>}
      {victor&&<Victory player={victor} goal={goal} onDismiss={()=>setVictor(null)}/>}
    </div>
  );
}

// ── Root ──────────────────────────────────────────────────────────────────────
function App(){
  const[gs,setGs]=useState(null),[loading,setLoading]=useState(true);
  useEffect(()=>{
    initFirebase();
    loadState().then(r=>{setGs(r?.done?r:mkState(0));setLoading(false);});
  },[]);
  if(loading) return <div style={{height:"100dvh",background:"#0d0d0d",display:"flex",alignItems:"center",justifyContent:"center",color:"#FFD700",fontFamily:F,fontSize:22,fontWeight:900,letterSpacing:3}}>🎱 SCOREKEEPER</div>;
  if(!gs?.done) return <Setup state={gs} onDone={setGs}/>;
  return <Game init={gs}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
